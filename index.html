<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountability Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">

<style>
  :root{
    --bg: #f5f1e6;
    --surface: #ffffff;
    --surface-2: #ede6d4;
    --ink: #211d16;
    --ink-dim: #6f6656;
    --ink-faint: #a89c85;
    --accent: #d95f1e;
    --accent-ink: #ffffff;
    --gold: #b3801a;
    --good: #3f8a4c;
    --bad: #b23b3b;
    --line: #ddd2b8;
    --shadow: 0 1px 2px rgba(33,29,22,.06), 0 6px 16px -8px rgba(33,29,22,.15);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #15130f;
      --surface: #201c15;
      --surface-2: #2a2419;
      --ink: #f4eee0;
      --ink-dim: #a89c85;
      --ink-faint: #6f6656;
      --accent: #ff8a3d;
      --accent-ink: #1a1006;
      --gold: #ffcf70;
      --good: #7cbf6e;
      --bad: #e07a7a;
      --line: #3a3324;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #15130f;
    --surface: #201c15;
    --surface-2: #2a2419;
    --ink: #f4eee0;
    --ink-dim: #a89c85;
    --ink-faint: #6f6656;
    --accent: #ff8a3d;
    --accent-ink: #1a1006;
    --gold: #ffcf70;
    --good: #7cbf6e;
    --bad: #e07a7a;
    --line: #3a3324;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
  }

  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  html{ color-scheme: light dark; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input{ font-family: inherit; }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 64px;
  }

  .top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-mark{ width: 22px; height: 22px; color: var(--accent); flex: none; }
  .brand-name{
    font-family: "Bebas Neue", "Manrope", sans-serif;
    font-size: 19px;
    letter-spacing: 0.03em;
  }
  .top-right{ display: flex; align-items: center; gap: 10px; }
  .today-date{
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink-dim);
    text-align: right;
    letter-spacing: 0.02em;
  }
  .day-nav{
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 18px;
  }
  .day-arrow{
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .day-arrow:hover{ border-color: var(--ink-faint); }
  .day-arrow:disabled{ opacity: .35; cursor: default; }
  .day-nav-label{
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12.5px; color: var(--ink-dim); text-align: center; min-width: 168px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .day-nav-label .dn-today-tag{
    color: var(--accent); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    background: none; border: none; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .icon-btn{
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 99px; padding: 7px 13px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: border-color .15s ease, background .15s ease;
  }
  .icon-btn:hover{ border-color: var(--ink-faint); }
  .icon-btn:active{ transform: scale(.96); }
  .icon-btn svg{ width: 14px; height: 14px; }
  .icon-btn.accent{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .banner{
    display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--gold) 16%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
    border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
    font-size: 12.5px; color: var(--ink-dim);
  }
  .banner svg{ width: 16px; height: 16px; color: var(--gold); flex: none; }

  .join-card{
    background: var(--surface); border: 1px dashed var(--ink-faint);
    border-radius: var(--radius); padding: 20px; margin-bottom: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .join-card h2{ margin: 0; font-family: "Bebas Neue", sans-serif; font-size: 20px; letter-spacing: .02em; }
  .join-card p{ margin: 0; font-size: 12.5px; color: var(--ink-dim); }
  .join-row{ display: flex; gap: 8px; flex-wrap: wrap; }
  .text-input{
    flex: 1; min-width: 140px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
  }
  .text-input:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }
  .import-row{ display: flex; align-items: center; gap: 8px; }
  .import-row button{
    background: none; border: none; color: var(--gold); font-weight: 700; font-size: 12px;
    cursor: pointer; padding: 0; text-decoration: underline;
  }

  .roster{ display: flex; flex-direction: column; gap: 14px; }
  .member-card{
    background: linear-gradient(155deg, var(--surface), var(--surface-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .member-card.mine{ border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .member-head{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .member-who{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .member-avatar{
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--surface-2); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: "Bebas Neue", sans-serif; font-size: 15px; letter-spacing: .02em;
    border: 1px solid var(--line);
  }
  .member-name{ font-weight: 800; font-size: 14.5px; }
  .solo-name-input{
    font-weight: 800; font-size: 14.5px; color: var(--ink); background: none; border: none;
    border-bottom: 1px dashed var(--line); padding: 0 0 1px; width: 140px; max-width: 100%;
  }
  .solo-name-input:focus{ outline: none; border-bottom-color: var(--accent); }
  .solo-name-input::placeholder{ color: var(--ink-faint); font-weight: 700; }
  .member-name .you-tag{ color: var(--accent); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }
  .member-mini{ font-size: 11.5px; color: var(--ink-dim); font-family: "JetBrains Mono", monospace; }
  .member-summary{ display: flex; align-items: center; gap: 14px; flex: none; }
  .mini-ring{ width: 38px; height: 38px; }
  .mini-ring svg{ width: 100%; height: 100%; transform: rotate(-90deg); }
  .mini-ring circle{ fill: none; stroke-width: 5; }
  .mini-ring .track{ stroke: var(--line); }
  .mini-ring .fill{ stroke: var(--accent); stroke-linecap: round; }
  .chev{ width: 16px; height: 16px; color: var(--ink-faint); transition: transform .2s ease; flex: none; }
  .member-card.expanded .chev{ transform: rotate(180deg); }

  .member-body{ display: none; margin-top: 18px; }
  .member-card.expanded .member-body{ display: block; }

  .hero-mid{
    display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
    padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
  }
  .ring-wrap{ position: relative; width: 92px; height: 92px; flex: none; }
  .ring-wrap svg{ width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track{ fill: none; stroke: var(--line); stroke-width: 9; }
  .ring-fill{
    fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round;
    transition: stroke-dashoffset .5s cubic-bezier(.4,1.4,.4,1);
  }
  .ring-center{
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-count{ font-family: "Bebas Neue", sans-serif; font-size: 24px; line-height: 1; }
  .ring-label{ font-size: 9px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }

  .hero-stats{ display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .streak-row{ display: flex; align-items: center; gap: 10px; }
  .flame{ width: 24px; height: 24px; color: var(--accent); flex: none; }
  .flame.dim{ color: var(--ink-faint); }
  .streak-num{ font-family: "Bebas Neue", sans-serif; font-size: 26px; line-height: 1; }
  .streak-caption{ font-size: 11.5px; color: var(--ink-dim); }
  .streak-best{ font-size: 11.5px; color: var(--ink-faint); font-family: "JetBrains Mono", monospace; }

  .xp-top{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .xp-level{ font-size: 12px; font-weight: 700; color: var(--gold); }
  .xp-nums{ font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--ink-faint); }
  .xp-bar{ height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .xp-fill{ height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 99px; transition: width .5s ease; }

  .section-label{
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); margin: 18px 2px 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label .add-habit-link{
    text-transform: none; letter-spacing: 0; font-weight: 700; font-size: 12px;
    color: var(--accent); cursor: pointer; background: none; border: none; padding: 0;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .section-label .add-habit-link svg{ width: 13px; height: 13px; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .habit{
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: background .18s ease, border-color .18s ease;
  }
  .habit-main{
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 14px 12px; cursor: pointer; font: inherit; color: inherit; background: none; border: none; width: 100%;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .habit-main:active{ transform: scale(.97); }
  .habit-main:focus-visible{ outline: 2px solid var(--accent); outline-offset: -2px; }
  .habit-icon{
    width: 34px; height: 34px; flex: none; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--ink-dim);
    transition: background .18s ease, color .18s ease;
  }
  .habit-icon svg{ width: 19px; height: 19px; }
  .habit-text{ min-width: 0; flex: 1; }
  .habit-label{ display: block; font-weight: 700; font-size: 13.5px; line-height: 1.25; }
  .habit-streak{ display: flex; align-items: center; gap: 4px; margin-top: 3px; color: var(--ink-faint); }
  .habit-streak svg{ width: 12px; height: 12px; }
  .habit-streak span{ font-family: "JetBrains Mono", monospace; font-size: 11px; }
  .habit-check{
    width: 24px; height: 24px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    transition: background .18s ease, border-color .18s ease;
  }
  .habit-check svg{ width: 13px; height: 13px; color: transparent; transition: color .15s ease; }

  .habit.done{ background: color-mix(in srgb, var(--good) 12%, var(--surface)); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .habit.done .habit-icon{ background: color-mix(in srgb, var(--good) 22%, var(--surface-2)); color: var(--good); }
  .habit.done .habit-streak{ color: var(--accent); }
  .habit.done .habit-check{ background: var(--good); border-color: var(--good); }
  .habit.done .habit-check svg{ color: var(--accent-ink); }
  .habit.pulse .habit-check{ animation: pop .32s ease; }
  .habit.locked .habit-main{ cursor: default; }
  @keyframes pop{ 0%{ transform: scale(1);} 45%{ transform: scale(1.35);} 100%{ transform: scale(1);} }

  .log-toggle{
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 8px; font-size: 10.5px; font-weight: 700; color: var(--ink-faint);
    background: var(--surface-2); border: none; border-top: 1px solid var(--line);
    cursor: pointer; text-transform: uppercase; letter-spacing: .04em;
  }
  .log-toggle svg{ width: 11px; height: 11px; }
  .log-panel{ display: none; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .habit.log-open .log-panel{ display: block; }
  .log-rows{ display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .log-row{
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 9px; font-size: 12px;
  }
  .log-row .lr-name{ font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-row .lr-detail{ color: var(--ink-dim); font-family: "JetBrains Mono", monospace; font-size: 11px; }
  .log-row .lr-x{
    background: none; border: none; color: var(--ink-faint); cursor: pointer; flex: none;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
  }
  .log-row .lr-x:hover{ color: var(--bad); background: var(--surface-2); }
  .log-row .lr-x svg{ width: 10px; height: 10px; }
  .log-form{ display: flex; gap: 6px; }
  .log-form input{ background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 7px 9px; font-size: 12px; }
  .log-form .lf-name{ flex: 1.4; min-width: 0; }
  .log-form .lf-detail{ flex: 1; min-width: 0; }
  .log-form button{
    background: var(--accent); border: none; color: var(--accent-ink); border-radius: 8px;
    width: 30px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .log-form button svg{ width: 13px; height: 13px; }
  .log-empty{ font-size: 11.5px; color: var(--ink-faint); margin: 0 0 8px; }
  .sleep-log{ padding: 0 12px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sleep-log input{ width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }

  .heat-scroll{ overflow-x: auto; padding-bottom: 4px; margin: 0 -2px; }
  .heat-row{ display: flex; gap: 4px; padding: 2px; width: max-content; }
  .heat-cell{
    width: 15px; height: 15px; border-radius: 4px; background: var(--line);
    flex: none;
  }
  .heat-cell[data-level="1"]{ background: color-mix(in srgb, var(--accent) 28%, var(--line)); }
  .heat-cell[data-level="2"]{ background: color-mix(in srgb, var(--accent) 52%, var(--line)); }
  .heat-cell[data-level="3"]{ background: color-mix(in srgb, var(--accent) 76%, var(--line)); }
  .heat-cell[data-level="4"]{ background: var(--accent); }
  .heat-cell.today{ box-shadow: 0 0 0 2px var(--gold); }
  .heat-foot{ display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; font-family: "JetBrains Mono", monospace; }

  .toast{
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg);
    padding: 12px 18px; border-radius: 99px;
    display: flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 13.5px;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; z-index: 30;
    transition: opacity .25s ease, transform .25s ease;
    max-width: calc(100vw - 40px); text-align: center;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }
  .toast svg{ width: 16px; height: 16px; color: var(--accent); flex: none; }

  canvas.confetti{ position: fixed; inset: 0; pointer-events: none; z-index: 15; }

  .modal-overlay{
    position: fixed; inset: 0; background: rgba(20,16,10,.5);
    display: none; align-items: flex-end; justify-content: center; z-index: 40; padding: 0;
  }
  .modal-overlay.open{ display: flex; }
  .modal{
    background: var(--bg); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px;
    max-height: 84vh; overflow-y: auto; padding: 20px 18px 28px;
    box-shadow: 0 -12px 40px -12px rgba(0,0,0,.4);
  }
  @media (min-width: 700px){
    .modal-overlay{ align-items: center; }
    .modal{ border-radius: 20px; max-height: 80vh; }
  }
  .modal-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h2{ margin: 0; font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: .02em; }
  .modal-close{ background: var(--surface-2); border: none; color: var(--ink); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .modal-close svg{ width: 14px; height: 14px; }
  .suggest-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .suggest-item{
    display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .suggest-item:hover{ border-color: var(--accent); }
  .suggest-item.added{ opacity: .45; cursor: default; }
  .suggest-item .si-icon{ width: 26px; height: 26px; flex: none; border-radius: 8px; background: var(--surface-2); color: var(--ink-dim); display: flex; align-items: center; justify-content: center; }
  .suggest-item .si-icon svg{ width: 15px; height: 15px; }
  .custom-form{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .custom-form label{ display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-dim); margin-top: 8px; }
  .manage-list{ display: flex; flex-direction: column; gap: 6px; }
  .manage-row{ display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .manage-row .mr-icon{ width: 22px; height: 22px; flex: none; color: var(--ink-dim); display: flex; align-items: center; justify-content: center; }
  .manage-row .mr-icon svg{ width: 14px; height: 14px; }
  .manage-row span{ flex: 1; font-weight: 700; }
  .manage-row button{ background: none; border: none; color: var(--ink-faint); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .manage-row button:hover{ color: var(--bad); background: var(--surface-2); }
  .manage-row button svg{ width: 11px; height: 11px; }

  .invite-copy{ display: none; margin-top: 8px; }
  .invite-copy.show{ display: flex; gap: 6px; }

  .chip-section-label{ font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; margin: 10px 0 6px; }
  .chip-section-label:first-of-type{ margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
  .chip-group{ display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip-group-segmented{ display: flex; flex-wrap: nowrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; gap: 0; }
  .chip-group-segmented .chip{ flex: 1; border-radius: 0; border: none; border-right: 1px solid var(--line); text-align: center; }
  .chip-group-segmented .chip:last-child{ border-right: none; }
  .chip{ background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-dim); border-radius: 99px; padding: 6px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .chip.selected{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .log-submit{ background: var(--accent); border: none; color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

  function confettiBurst(){
    if(prefersReduced) return;
    var canvas = document.createElement("canvas");
    canvas.className = "confetti";
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext("2d");
    var colors = ["#ff8a3d", "#ffcf70", "#7cbf6e", "#f4eee0"];
    var particles = [];
    for(var i=0;i<70;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*60,
        y: canvas.height*0.4,
        vx: (Math.random()-0.5)*9,
        vy: -Math.random()*9 - 4,
        size: Math.random()*6+4,
        color: colors[i % colors.length],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3
      });
    }
    var start = performance.now();
    function frame(now){
      var elapsed = now - start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(function(p){
        p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx.restore();
      });
      if(elapsed < 1700){ requestAnimationFrame(frame); } else { canvas.remove(); }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- food calculator ---------- */
  /* ---------- weight + calorie-burn estimates ---------- */
  function latestWeightEntry(days, startKey){
    var key = startKey, guard = 0;
    while(guard++ < 730){
      if(days[key] && typeof days[key].weight === "number") return { date: key, value: days[key].weight };
      key = addDays(key, -1);
    }
    return null;
  }
  function currentWeightEntry(days){ return latestWeightEntry(days, REAL_TODAY); }
  function priorWeightEntry(days, refDate){ return latestWeightEntry(days, addDays(refDate, -1)); }
  function weightKgFor(member){
    var entry = currentWeightEntry(member.days);
    if(!entry) return null;
    var unit = member.weightUnit || "lb";
    return unit === "kg" ? entry.value : entry.value * LB_TO_KG;
  }
  /* MET formula: kcal = MET x weight(kg) x hours. The ~10% female adjustment and the
     mild age adjustment (RMR declines gradually past ~30) are common rough heuristics
     — a real estimate, not a lab-measured one. */
  function estimateBurn(member, met, minutes){
    var kg = weightKgFor(member);
    if(kg == null || !minutes) return null;
    var sexFactor = member.sex === "female" ? 0.9 : 1;
    var age = member.age;
    var ageFactor = (typeof age === "number" && age > 30) ? Math.max(0.85, 1 - (age - 30) * 0.002) : 1;
    return Math.round(met * kg * (minutes / 60) * sexFactor * ageFactor);
  }
  function totalBurnToday(member, habits){
    var rec = member.days[viewedDate];
    if(!rec || !rec._log) return 0;
    var total = 0;
    habits.forEach(function(h){
      var log = rec._log[h.id] || [];
      if(h.kind === "exercise"){
        log.forEach(function(e){
          if(e.type && e.duration){ var b = estimateBurn(member, GYM_MET[e.type] || 5, e.duration); if(b) total += b; }
          else if(e.minutes){ var b2 = estimateBurn(member, 5, e.minutes); if(b2) total += b2; }
        });
      } else if(h.kind === "cardio"){
        log.forEach(function(e){
          var mult = e.intensity ? (INTENSITY_MULT[e.intensity] || 1) : 1;
          var b = estimateBurn(member, (CARDIO_MET[e.type] || 6) * mult, e.duration);
          if(b) total += b;
        });
      }
    });
    return total;
  }
  function fmtShortDate(key){ return new Date(key + "T00:00:00").toLocaleDateString(undefined, heatFmt); }

  function computeGoalPlan(member){
    if(!member.goalWeight || !member.goalDate) return null;
    var entry = currentWeightEntry(member.days);
    if(!entry) return null;
    var unit = member.weightUnit || "lb";
    var currentLb = unit === "kg" ? entry.value / LB_TO_KG : entry.value;
    var goalLb = unit === "kg" ? member.goalWeight / LB_TO_KG : member.goalWeight;
    var deltaLb = currentLb - goalLb;
    var todayD = new Date(REAL_TODAY + "T00:00:00");
    var goalD = new Date(member.goalDate + "T00:00:00");
    var days = Math.round((goalD - todayD) / 86400000);
    if(Math.abs(deltaLb) < 0.1) return { reached: true };
    if(days <= 0) return { pastDue: true };
    var totalKcal = Math.abs(deltaLb) * 3500;
    var dailyKcal = Math.round(totalKcal / days);
    var losing = deltaLb > 0;
    var currentTarget = member.calorieTarget || 2000;
    var suggestedTarget = Math.round((losing ? currentTarget - dailyKcal : currentTarget + dailyKcal) / 10) * 10;
    var weeklyLb = Math.abs(deltaLb) / (days / 7);
    var minSafe = member.sex === "female" ? 1200 : 1500;
    return {
      days: days, deltaLb: deltaLb, losing: losing, weeklyLb: weeklyLb,
      dailyKcal: dailyKcal, suggestedTarget: suggestedTarget,
      tooAggressive: weeklyLb > 2, belowSafe: suggestedTarget < minSafe
    };
  }
  function goalSummaryHTML(plan){
    if(plan.reached) return '<p class="nutri-note">You’re already at your goal weight.</p>';
    if(plan.pastDue) return '<p class="nutri-note">Pick a goal date in the future.</p>';
    var verb = plan.losing ? "lose" : "gain";
    var html = '<p class="goal-summary">' + Math.abs(plan.deltaLb).toFixed(1) + ' lb to ' + verb + ' in ' + plan.days + ' days (~' + plan.weeklyLb.toFixed(1) + ' lb/week).</p>' +
      '<div class="food-stats">' +
        '<div class="food-stat"><span class="fs-num">' + plan.suggestedTarget + '<span>kcal</span></span><span class="fs-label">Suggested Target</span></div>' +
        '<div class="food-stat"><span class="fs-num">' + plan.dailyKcal + '<span>kcal</span></span><span class="fs-label">Daily ' + (plan.losing ? "Deficit" : "Surplus") + '</span></div>' +
      '</div>';
    if(plan.tooAggressive) html += '<p class="nutri-note">That’s more than 2 lb/week — consider a later goal date for a safer, more sustainable pace.</p>';
    if(plan.belowSafe) html += '<p class="nutri-note">The suggested target is quite low. Consider covering part of the gap with exercise (burn ~' + plan.dailyKcal + ' kcal/day) instead of cutting food further, or extend your timeline.</p>';
    return html;
  }

  function foodMatch(name){
    var n = (name || "").trim().toLowerCase();
    if(!n) return null;
    var all = currentCustomFoods().concat(COMMON_FOODS);
    for(var i = 0; i < all.length; i++){ if(all[i].name.toLowerCase() === n) return all[i]; }

  function computeMicros(name, grams){
    var micro = MICRO_DATA[name];
    if(!micro) return null;
    var out = {};
    var any = false;
    Object.keys(MICRO_LABELS).forEach(function(k){
      var per100 = micro[k + "100"];
      if(per100 != null){
        out[k] = Math.round(per100 * grams / 100 * 10) / 10;
        any = true;
      }
    });
    return any ? out : null;
  }

  function computeMatchedNutrition(match, famt, funit){
    var kcal, protein = 0, carbs = 0, eaUnit = null, grams;
    if(funit === "ea" && match.serving){
      grams = famt * match.serving;
      kcal = Math.round(match.kcal100 * grams / 100);
      if(match.protein100) protein = Math.round(match.protein100 * grams / 100);
      if(match.carbs100) carbs = Math.round(match.carbs100 * grams / 100);
      eaUnit = match.unit;
    } else {
      grams = famt * (UNIT_GRAMS[funit] || 1);
      kcal = Math.round(match.kcal100 * grams / 100);
      if(match.protein100) protein = Math.round(match.protein100 * grams / 100);
      if(match.carbs100) carbs = Math.round(match.carbs100 * grams / 100);
    }
    return { kcal: kcal, protein: protein, carbs: carbs, eaUnit: eaUnit, micro: computeMicros(match.name, grams) };
  }

  function heatRowHTML(days, habits){
    var cells = [];
    var earliestKey = null;
    for(var i = 29; i >= 0; i--){
      var key = addDays(REAL_TODAY, -i);
      var c = countDone(days, key, habits);
      var level = c === 0 ? 0 : c <= Math.ceil(habits.length*0.3) ? 1 : c <= Math.ceil(habits.length*0.6) ? 2 : c < habits.length ? 3 : 4;
      if(!habits.length) level = 0;
      var label = new Date(key + "T00:00:00").toLocaleDateString(undefined, heatFmt) + " — " + c + "/" + habits.length;
      if(i === 29) earliestKey = label;
      cells.push('<div class="heat-cell' + (key === viewedDate ? " today" : "") + '" data-level="' + level + '" title="' + escHTML(label) + '"></div>');
    }
    return { row: cells.join(""), earliest: earliestKey };
  }

  /* ---------- leaderboard + evening reminder ---------- */
  function missingCoreHabits(member, habits){
    var core = coreHabits(habits);
    return core.filter(function(h){ return !isDone(member.days, REAL_TODAY, h.id); });
  }

  function leaderboardRowsHTML(){
    var habits = currentHabits();
    var core = coreHabits(habits);
    var meId = mode === "solo" ? "me" : (me && me.id);
    var rows = currentMembers().map(function(m){
      return {
        member: m,
        doneToday: countDone(m.days, REAL_TODAY, core),
        streak: currentStreak(m.days, habits, "__perfect__"),
        level: levelFor(xpFor(totals(m.days, habits)))
      };
    });
    rows.sort(function(a, b){
      if(b.doneToday !== a.doneToday) return b.doneToday - a.doneToday;
      if(b.streak !== a.streak) return b.streak - a.streak;
      return b.level - a.level;
    });
    return rows.map(function(r, idx){
      var isMe = r.member.id === meId;
      var name = r.member.solo ? "You" : r.member.name;
      return '<div class="lb-row' + (isMe ? " lb-me" : "") + '">' +

        '<span class="lb-avatar">' + escHTML(initialsFor(name)) + '</span>' +

  function microTotalsFor(entries){
    var totals = {};
    entries.forEach(function(f){
      if(!f.micro) return;
      Object.keys(f.micro).forEach(function(k){ totals[k] = (totals[k] || 0) + f.micro[k]; });
    });
    return totals;
  }

    var entries = rec._food || [];
    var totals = microTotalsFor(entries);
    var haveAny = Object.keys(totals).length > 0;
    var untracked = entries.filter(function(f){ return !f.micro; }).length;
    var body = '<div class="nutri-rows">' + Object.keys(MICRO_LABELS).map(function(k){
      var val = totals[k] || 0;

      return '<div class="nutri-row">' +
        '<div class="nutri-row-top"><span class="nutri-label">' + MICRO_LABELS[k] + '</span><span class="nutri-val">' + (Math.round(val * 10) / 10) + MICRO_UNITS[k] + '<span class="nutri-dv"> · ' + Math.round(pct) + '% DV</span></span></div>' +
        '<div class="nutri-bar"><div class="nutri-bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +

    els.nutriTitle.textContent = (member.solo ? "Your" : member.name + "’s") + " Nutrition — " + fmtShortDate(viewedDate);

  /* ---------- AI coach (Vercel-only: needs /api/coach, blocked by the artifact CSP) ---------- */
  function buildCoachSummary(member, habits){
    var rec = member.days[viewedDate] || {};
    var lines = [];
    lines.push("Date: " + viewedDate + (viewedDate === REAL_TODAY ? " (today)" : ""));
    lines.push("Perfect-day streak: " + currentStreak(member.days, habits, "__perfect__") + " days (best " + bestStreak(member.days, habits, "__perfect__") + ")");
    lines.push("Habits:");
    habits.forEach(function(h){
      lines.push("- " + h.label + ": " + (isDone(member.days, viewedDate, h.id) ? "done" : "not done"));
    });
    var foodEntries = rec._food || [];
    var totalKcal = foodEntries.reduce(function(s, f){ return s + f.kcal; }, 0);
    var totalProtein = foodEntries.reduce(function(s, f){ return s + (f.protein || 0); }, 0);
    var totalCarbs = foodEntries.reduce(function(s, f){ return s + (f.carbs || 0); }, 0);
    var burned = totalBurnToday(member, habits);
    lines.push("Food: " + totalKcal + " kcal logged (target " + (member.calorieTarget || 2000) + " kcal), protein " + totalProtein + "g, carbs " + totalCarbs + "g" +
      (foodEntries.length ? "; items: " + foodEntries.map(function(f){ return f.name; }).join(", ") : "; nothing logged yet"));
    if(burned > 0) lines.push("Estimated calories burned from exercise: " + burned);
    if(typeof rec.weight === "number") lines.push("Weight logged: " + rec.weight + " " + (member.weightUnit || "lb"));
    return lines.join("\n");
  }
  function openCoach(){
    var meId = mode === "solo" ? "me" : (me && me.id);
    var member = currentMembers().filter(function(m){ return m.id === meId; })[0];
    if(!member) return;
    els.coachBody.innerHTML = '<p class="coach-loading">' + ICONS.sparkle + '<span>Thinking…</span></p>';
    els.coachOverlay.classList.add("open");
    var summary = buildCoachSummary(member, currentHabits());
    fetch("/api/coach", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ summary: summary })
    }).then(function(r){

      return r.json();
    }).then(function(data){
      els.coachBody.innerHTML = '<p class="coach-tip">' + escHTML(data.tip || "No tip returned.") + '</p>';
    }).catch(function(){
      els.coachBody.innerHTML =
        '<p class="nutri-note">The AI Coach couldn’t reach the server. This only works when the app is running on your Vercel deployment with an Anthropic API key configured — it won’t work inside the Claude artifact preview or a plain local file.</p>';
    });
  }

  /* ---------- photo-based food lookup (Vercel-only: needs /api/photo-food, blocked by the artifact CSP) ---------- */
  var photoTargetMember = null, photoTargetHabit = null;
  var captureStream = null;
  function openLiveScanner(memberId, habitId){
    photoTargetMember = memberId; photoTargetHabit = habitId;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      useFileInput();
      return;
    }
    els.captureOverlay.classList.add("open");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream){
      captureStream = stream;
      els.captureVideo.srcObject = stream;
    }).catch(function(){
      closeCaptureView();
      useFileInput();
    });
  }
  function closeCaptureView(){
    els.captureOverlay.classList.remove("open");
    if(captureStream){ captureStream.getTracks().forEach(function(t){ t.stop(); }); captureStream = null; }
    els.captureVideo.srcObject = null;
  }
  function captureShot(){
    var video = els.captureVideo;
    if(!video.videoWidth){ showToast("Camera isn't ready yet — try again in a second."); return; }
    var canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    closeCaptureView();
    canvas.toBlob(function(blob){
      if(blob) readLabelWithVision(blob); else showToast("Couldn't capture that photo.");
    }, "image/jpeg", 0.9);
  }
  function useFileInput(){
    els.photoFoodInput.value = "";
    els.photoFoodInput.click();
  }
  function rememberScannedFood(food){
    var n = food.name.toLowerCase();
    if(mode === "solo"){
      var i = -1;
      for(var j = 0; j < soloState.customFoods.length; j++){ if(soloState.customFoods[j].name.toLowerCase() === n){ i = j; break; } }
      if(i !== -1) soloState.customFoods[i] = food; else soloState.customFoods.push(food);
      saveSolo(soloState);
    } else if(mode === "board"){
      board.customFoods = board.customFoods || [];
      var k = -1;
      for(var m = 0; m < board.customFoods.length; m++){ if(board.customFoods[m].name.toLowerCase() === n){ k = m; break; } }
      if(k !== -1) board.customFoods[k] = food; else board.customFoods.push(food);
      schedulePublish();
    }
  }
  function applyScannedFood(food, toastSuffix){
    rememberScannedFood(food);
    var form = document.querySelector('.food-form[data-member="' + photoTargetMember + '"][data-habit="' + photoTargetHabit + '"]');
    if(form){
      var nameInput = form.querySelector('[data-role="ff-name"]');
      var amtInput = form.querySelector('[data-role="ff-amt"]');
      var eaBtn = form.querySelector('.unit-toggle button[data-unit="ea"]');
      nameInput.value = food.name;
      amtInput.value = "1";
      if(eaBtn) eaBtn.click();
      updateFoodPreview(form);
      amtInput.focus();
    }
    showToast("Found: " + food.name + (toastSuffix || ""));
  }
  function readLabelWithVision(file){
    showToast("Reading the label…");
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result || "";
      var comma = dataUrl.indexOf(",");
      var base64 = comma !== -1 ? dataUrl.slice(comma + 1) : "";
      if(!base64){ showToast("Couldn't read that photo."); return; }
      fetch("/api/photo-food", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mediaType: file.type || "image/jpeg" })
      }).then(function(r){
        if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.error || ("HTTP " + r.status)); });
        return r.json();
      }).then(function(data){
        if(!data.found){ showToast("Couldn't identify that food — try a clearer photo of the label."); return; }
        var food = {
          name: data.name, kcal100: data.kcal100, protein100: data.protein100, carbs100: data.carbs100,
          serving: data.servingGrams, unit: data.servingLabel
        };
        var confNote = data.confidence === "label" ? "" : data.confidence === "brand" ? " — from brand, not label, double-check" : " — rough guess, double-check";
        applyScannedFood(food, " (" + data.servingLabel + " ≈ " + data.servingGrams + "g)" + confNote);
      }).catch(function(){
        showToast("Photo lookup isn't available here — this only works on the Vercel deployment with an Anthropic API key configured.");
      });
    };
    reader.readAsDataURL(file);
  }
  function onPhotoFoodSelected(file){
    if(!file) return;
    readLabelWithVision(file);
  }

  var MOUNTAIN_TZ = "America/Denver";
  var REMINDER_KEY = "emberstreak.reminderShown";
  function mountainHour(){
    return parseInt(new Intl.DateTimeFormat("en-US", { timeZone: MOUNTAIN_TZ, hour: "numeric", hour12: false }).format(new Date()), 10);
  }
  function checkEveningReminder(){
    if(els.lbOverlay.classList.contains("open")) return;
    var hour = mountainHour();
    if(hour < 21) return;
    var last = null;
    try{ last = localStorage.getItem(REMINDER_KEY); }catch(e){}
    if(last === REAL_TODAY) return;
    try{ localStorage.setItem(REMINDER_KEY, REAL_TODAY); }catch(e){}
    openLeaderboard(true);
  }

      var isMine = mode === "solo" ? true : (m.id === meId);
      var isExpanded = mode === "solo" ? true : (!!expanded[m.id] || isMine);
      return memberCardHTML(m, isMine, isExpanded, habits);
    }).join("");
  }

  /* Re-renders without losing focus/cursor on the input the user is typing in
     — needed for live-recompute-as-you-type fields (age, weight). */
  function renderPreserveFocus(){
    var active = document.activeElement;
    var role = active && active.dataset ? active.dataset.role : null;
    var memberId = active && active.dataset ? active.dataset.member : null;
    var selStart = null, selEnd = null;
    if(active && typeof active.selectionStart === "number"){
      selStart = active.selectionStart; selEnd = active.selectionEnd;
    }
    render();
    if(role){
      var sel = '[data-role="' + role + '"]' + (memberId ? '[data-member="' + memberId + '"]' : "");
      var el = document.querySelector(sel);
      if(el){
        el.focus();
        if(selStart != null && typeof el.setSelectionRange === "function"){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }
  }

  /* ---------- mutation helpers (shared shape) ---------- */
  function ensureDay(days, key){ if(!days[key]) days[key] = {}; return days[key]; }

  function withTracking(days, mutator){
    var wasPerfect = isPerfectDay(days, viewedDate, currentHabits());
    var tBefore = totals(days, currentHabits());
    var levelBefore = levelFor(xpFor(tBefore));
    var extra = mutator() || {};
    var nowPerfect = isPerfectDay(days, viewedDate, currentHabits());
    var tAfter = totals(days, currentHabits());
    var levelAfter = levelFor(xpFor(tAfter));
    var res = { wasPerfect: wasPerfect, nowPerfect: nowPerfect, levelBefore: levelBefore, levelAfter: levelAfter, didCheck: true };
    for(var k in extra) res[k] = extra[k];
    return res;
  }

  function applyToggle(days, habitId){
    return withTracking(days, function(){
      var rec = ensureDay(days, viewedDate);
      rec[habitId] = !rec[habitId];
      return { didCheck: !!rec[habitId] };
    });
  }

  function applyAddLog(days, habitId, name, detail, minutes){
    return withTracking(days, function(){
      var rec = ensureDay(days, viewedDate);
      if(!rec._log) rec._log = {};
      if(!rec._log[habitId]) rec._log[habitId] = [];
      var entry = { name: name, detail: detail || "" };
      if(minutes) entry.minutes = minutes;
      rec._log[habitId].push(entry);
      if(!rec[habitId]) rec[habitId] = true;
      return {};
    });
  }

  function applyRemoveLog(days, habitId, idx){
    var rec = days[viewedDate];
    if(rec && rec._log && rec._log[habitId]) rec._log[habitId].splice(idx, 1);
  }

  function applyAddSessionLog(days, habitId, type, duration, intensity){
    return withTracking(days, function(){
      var rec = ensureDay(days, viewedDate);
      if(!rec._log) rec._log = {};
      if(!rec._log[habitId]) rec._log[habitId] = [];
      var entry = { type: type, duration: duration };
      if(intensity) entry.intensity = intensity;
      rec._log[habitId].push(entry);
      if(!rec[habitId]) rec[habitId] = true;
      return {};
    });
  }

  function foodTotalFor(rec){ return rec && rec._food ? rec._food.reduce(function(s, f){ return s + f.kcal; }, 0) : 0; }

  function applyAddFood(days, habitId, entry, target){
    return withTracking(days, function(){
      var rec = ensureDay(days, viewedDate);
      if(!rec._food) rec._food = [];
      rec._food.push(entry);
      var total = foodTotalFor(rec);
      rec[habitId] = total > 0 && total <= target;
      return {};
    });
  }

  function applyRemoveFood(days, habitId, idx, target){
    var rec = days[viewedDate];
    if(rec && rec._food){
      rec._food.splice(idx, 1);
      var total = foodTotalFor(rec);
      rec[habitId] = total > 0 && total <= target;
    }
  }

  function applyEditFood(days, habitId, idx, entry, target){
    var rec = days[viewedDate];
    if(rec && rec._food && rec._food[idx]){
      rec._food[idx] = entry;
      var total = foodTotalFor(rec);
      rec[habitId] = total > 0 && total <= target;
    }
  }

  function applySetWeight(days, value){ ensureDay(days, viewedDate).weight = value; }

  function soloSetTarget(habitId, target){

  function pulseCard(memberId, habitId){
    var card = els.roster.querySelector('[data-card="' + memberId + ":" + habitId + '"]');
    if(card){ card.classList.add("pulse"); setTimeout(function(){ card.classList.remove("pulse"); }, 340); }
  }
  function afterToggleFeedback(res, days){
    if(!res.didCheck) return;
    if(!res.wasPerfect && res.nowPerfect){
      confettiBurst();
      showToast("Perfect day — " + currentStreak(days, currentHabits(), "__perfect__") + " day streak");
    } else if(res.levelAfter > res.levelBefore){
      showToast("Level up — " + titleFor(res.levelAfter));
    }
  }

  /* ---------- board (shared, classic-artifact publish) actions ---------- */
  function findMember(id){ return board.members.filter(function(m){ return m.id === id; })[0]; }

  /* Coalesces rapid-fire changes (tapping several habits quickly, typing) into one
     publish instead of one per action — each publish reloads the view, so without
     this, fast taps would reload the page repeatedly and feel glitchy. While the
     "Add habit" modal is open, a mid-selection reload would silently wipe the
     checkboxes the user is still picking, so publishes are held until it closes. */
  var publishTimer = null;
  var publishHeld = false;
  function schedulePublish(){
    clearTimeout(publishTimer);
    if(pickerOpen){ publishHeld = true; return; }
    publishTimer = setTimeout(publishBoard, 700);
  }

  function publishBoard(){
    if(!boardCap) return;
    pending = true;
    var json = JSON.stringify(board).replace(/<\/(script)/gi, "<\\/$1");
    var html = "<!doctype html><html>" + HEAD_HTML + "<body>" + STATIC_BODY_HTML +
      "<script>" + SELF_SCRIPT_SRC + "<\/script>" +
      '<script type="application/json" id="boardData">' + json + "<\/script>" +
      "</body></html>";
    boardCap.publish(html).then(function(){
      pending = false;
    }).catch(function(err){
      pending = false;
      if(err && (err.code === "not_writer" || err.code === "not_granted")){
        mode = "readonly"; render();
      } else if(err && err.code === "conflict"){
        // the runtime is already reloading this view to the winning version
      } else {
        showToast("Couldn't save — try that again");
      }
    });
  }

  function boardToggle(memberId, habitId){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    var res = applyToggle(member.days, habitId);
    render();
    pulseCard(memberId, habitId);
    afterToggleFeedback(res, member.days);
    schedulePublish();
  }
  function boardAddLog(memberId, habitId, name, detail, minutes){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    var res = applyAddLog(member.days, habitId, name, detail, minutes);

    afterToggleFeedback(res, member.days);
    schedulePublish();
  }
  function boardRemoveLog(memberId, habitId, idx){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    applyRemoveLog(member.days, habitId, idx);

    schedulePublish();
  }
  function boardAddSessionLog(memberId, habitId, type, duration, intensity){

    if(!member) return;
    var res = applyAddSessionLog(member.days, habitId, type, duration, intensity);

  }
  function boardAddFood(memberId, habitId, entry, rememberFood){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    var res = applyAddFood(member.days, habitId, entry, member.calorieTarget || 2000);

      board.customFoods = board.customFoods || [];
      board.customFoods.push(rememberFood);

  function boardRemoveFood(memberId, habitId, idx){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    applyRemoveFood(member.days, habitId, idx, member.calorieTarget || 2000);

  function boardEditFood(memberId, habitId, idx, entry){

    applyEditFood(member.days, habitId, idx, entry, member.calorieTarget || 2000);

    schedulePublish();
  }
  function boardSetTarget(memberId, habitId, target){
    if(!me || memberId !== me.id) return;
    var member = findMember(memberId);
    if(!member) return;
    member.calorieTarget = target;
    var rec = member.days[viewedDate];
    if(rec && rec._food) rec[habitId] = foodTotalFor(rec) > 0 && foodTotalFor(rec) <= target;
    render();

  function boardSetWeight(memberId, value, unit){

  function boardAddHabits(list){

  }
  function boardRemoveHabit(habitId){
    board.habits = board.habits.filter(function(h){ return h.id !== habitId; });
    renderPicker();
    render();
    schedulePublish();
  }
  function boardJoin(name, importHistory){
    var id = uid();
    var days = {};
    if(importHistory){
      try{
        var raw = localStorage.getItem(SOLO_KEY) || localStorage.getItem(OLD_SOLO_KEY);
        if(raw) days = JSON.parse(raw).days || {};
      }catch(e){}
    }
    var member = { id: id, name: name, days: days };
    board.members.push(member);
    me = { id: id, name: name };
    saveMe(me);
    render();
    publishBoard();
  }

  /* ---------- add-habit shared entry point ---------- */
  function addHabitsEverywhere(list){
    if(mode === "solo") soloAddHabits(list); else boardAddHabits(list);
  }
  function removeHabitEverywhere(habitId){
    if(mode === "solo") soloRemoveHabit(habitId); else boardRemoveHabit(habitId);
  }

  /* ---------- events ---------- */
  document.body.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(t){
      var action = t.dataset.action;
      if(action === "toggle"){
        if(mode === "solo") soloToggle(t.dataset.habit);
        else if(mode === "board") boardToggle(t.dataset.member, t.dataset.habit);
        return;
      }
      if(action === "expand"){
        if(mode !== "solo"){
          var id = t.dataset.member;
          if(me && id === me.id) return; // your own card is always open
          expanded[id] = !expanded[id];
          render();
        }
        return;
      }
      if(action === "logtoggle"){
        var key = t.dataset.card;
        var habitCard = t.closest(".habit");
        if(openLogs.has(key)) openLogs.delete(key); else openLogs.add(key);
        if(habitCard) habitCard.classList.toggle("log-open");
        return;
      }
      if(action === "addlog"){
        var wrap = t.closest(".log-form");
        var nameInput = wrap.querySelector('[data-role="lf-name"]');
        var detailInput = wrap.querySelector('[data-role="lf-detail"]');
        var minutesInput = wrap.querySelector('[data-role="lf-minutes"]');
        var name = (nameInput.value || "").trim();
        if(!name) return;
        var detail = (detailInput.value || "").trim();
        var minutes = minutesInput ? parseFloat(minutesInput.value) : NaN;
        if(mode === "solo") soloAddLog(t.dataset.habit, name, detail, minutes > 0 ? minutes : null);
        else if(mode === "board") boardAddLog(t.dataset.member, t.dataset.habit, name, detail, minutes > 0 ? minutes : null);
        return;
      }
      if(action === "rmlog"){
        var idx = parseInt(t.dataset.idx, 10);
        if(mode === "solo") soloRemoveLog(t.dataset.habit, idx);
        else if(mode === "board") boardRemoveLog(t.dataset.member, t.dataset.habit, idx);
        return;
      }
      if(action === "togglesuggest"){
        var sid = t.dataset.sid;
        if(pickerSelected.has(sid)) pickerSelected.delete(sid); else pickerSelected.add(sid);
        renderPicker();
        return;
      }
      if(action === "removehabit"){
        removeHabitEverywhere(t.dataset.hid);
        return;
      }
      if(action === "pickchip"){
        var group = t.parentElement;
        Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.classList.remove("selected"); });
        t.classList.add("selected");
        return;
      }
      if(action === "addsessionlog"){
        var panel = t.closest(".log-panel");
        var durBtn = panel.querySelector('[data-role="duration-group"] .chip.selected');
        var typeBtn = panel.querySelector('[data-role="type-group"] .chip.selected');
        var intensityBtn = panel.querySelector('[data-role="intensity-group"] .chip.selected');
        var duration = durBtn ? parseInt(durBtn.dataset.value, 10) : 30;
        var type = typeBtn ? typeBtn.dataset.value : "";
        var intensity = intensityBtn ? intensityBtn.dataset.value : null;
        if(mode === "solo") soloAddSessionLog(t.dataset.habit, type, duration, intensity);
        else if(mode === "board") boardAddSessionLog(t.dataset.member, t.dataset.habit, type, duration, intensity);
        return;
      }
      if(action === "unit"){
        var utGroup = t.parentElement;
        Array.prototype.forEach.call(utGroup.querySelectorAll("button"), function(b){ b.classList.remove("selected"); });
        t.classList.add("selected");
        var form = t.closest(".food-form");
        if(form){
          var qtyRow = form.querySelector('[data-role="qty-chips"]');
          if(qtyRow) qtyRow.classList.toggle("show", ["ea", "cup", "tbsp", "tsp"].indexOf(t.dataset.unit) !== -1);
          updateFoodPreview(form);
        }
        return;
      }
      if(action === "pickqty"){
        var qtyForm = t.closest(".food-form");
        var qtyAmtInput = qtyForm.querySelector('[data-role="ff-amt"]');
        qtyAmtInput.value = t.dataset.value;
        updateFoodPreview(qtyForm);
        return;
      }
      if(action === "addfood"){
        var ffForm = t.closest(".food-form");
        var nameInput = ffForm.querySelector('[data-role="ff-name"]');
        var amtInput = ffForm.querySelector('[data-role="ff-amt"]');
        var unitBtn = ffForm.querySelector(".unit-toggle button.selected");
        var kcalInput = ffForm.querySelector('[data-role="ff-kcal"]');
        var rememberInput = ffForm.querySelector('[data-role="ff-remember"]');
        var fname = (nameInput.value || "").trim();
        var famt = parseFloat(amtInput.value);
        if(!fname || !(famt > 0)){ showToast("Enter a food and an amount"); return; }
        var funit = unitBtn ? unitBtn.dataset.unit : "g";
        var match = foodMatch(fname);
        var kcal, rememberFood = null, eaUnit = null, protein = 0, carbs = 0, micro = null;
        if(match){
          var calc = computeMatchedNutrition(match, famt, funit);
          kcal = calc.kcal; protein = calc.protein; carbs = calc.carbs; eaUnit = calc.eaUnit; micro = calc.micro;
        } else {
          var manualKcal = parseFloat(kcalInput.value);
          if(!(manualKcal > 0)){ showToast("Enter calories for this food"); kcalInput.focus(); return; }
          kcal = Math.round(manualKcal);
          if(funit !== "ea" && rememberInput && rememberInput.checked){
            var gramsManual = Math.round(famt * (UNIT_GRAMS[funit] || 1));
            rememberFood = { name: fname, kcal100: Math.round(kcal / gramsManual * 100), serving: gramsManual, unit: "serving" };
          }
        }
        var entry = { name: fname, amount: famt, unit: funit, kcal: kcal };
        if(eaUnit) entry.eaUnit = eaUnit;
        if(protein) entry.protein = protein;
        if(carbs) entry.carbs = carbs;
        if(micro) entry.micro = micro;
        if(mode === "solo") soloAddFood(t.dataset.habit, entry, rememberFood);
        else if(mode === "board") boardAddFood(t.dataset.member, t.dataset.habit, entry, rememberFood);
        return;
      }
      if(action === "editfoodrow"){
        var editRow = t.closest(".food-row");
        var editMember = mode === "solo" ? { id: "me", days: soloState.days } : findMember(t.dataset.member);
        var editRec = editMember ? editMember.days[viewedDate] : null;
        var editEntry = editRec && editRec._food ? editRec._food[parseInt(t.dataset.idx, 10)] : null;
        if(editRow && editEntry) editRow.outerHTML = foodEditRowHTML(t.dataset.member, t.dataset.habit, editEntry, parseInt(t.dataset.idx, 10));
        return;
      }
      if(action === "canceledit"){
        render();
        return;
      }
      if(action === "freunit"){
        var freGroup = t.parentElement;
        Array.prototype.forEach.call(freGroup.querySelectorAll("button"), function(b){ b.classList.remove("selected"); });
        t.classList.add("selected");
        var freRow = t.closest(".food-row-edit");
        var freQty = freRow.querySelector('[data-role="fre-qtychips"]');
        if(freQty) freQty.classList.toggle("show", ["ea", "cup", "tbsp", "tsp"].indexOf(t.dataset.unit) !== -1);
        return;
      }
      if(action === "freqty"){
        var freqRow = t.closest(".food-row-edit");
        freqRow.querySelector('[data-role="fre-amt"]').value = t.dataset.value;
        return;
      }
      if(action === "savefoodedit"){
        var seRow = t.closest(".food-row-edit");
        var seMemberId = seRow.dataset.member, seHabitId = seRow.dataset.habit, seIdx = parseInt(seRow.dataset.idx, 10);
        var seAmt = parseFloat(seRow.querySelector('[data-role="fre-amt"]').value);
        var seUnitBtn = seRow.querySelector(".unit-toggle button.selected");
        var seUnit = seUnitBtn ? seUnitBtn.dataset.unit : "g";
        if(!(seAmt > 0)){ showToast("Enter an amount"); return; }
        var seName = seRow.dataset.name;
        var seMatch = foodMatch(seName);
        var seEntry = { name: seName, amount: seAmt, unit: seUnit };
        if(seMatch){
          var seCalc = computeMatchedNutrition(seMatch, seAmt, seUnit);
          seEntry.kcal = seCalc.kcal;
          if(seCalc.eaUnit) seEntry.eaUnit = seCalc.eaUnit;
          if(seCalc.protein) seEntry.protein = seCalc.protein;
          if(seCalc.carbs) seEntry.carbs = seCalc.carbs;
          if(seCalc.micro) seEntry.micro = seCalc.micro;
        } else {
          var seKcalInput = seRow.querySelector('[data-role="fre-kcal"]');
          var seKcal = seKcalInput ? parseFloat(seKcalInput.value) : NaN;
          if(!(seKcal > 0)){ showToast("Enter calories for this food"); return; }
          seEntry.kcal = Math.round(seKcal);
        }
        if(mode === "solo") soloEditFood(seHabitId, seIdx, seEntry);
        else if(mode === "board") boardEditFood(seMemberId, seHabitId, seIdx, seEntry);
        return;
      }
      if(action === "rmfood"){
        var fidx = parseInt(t.dataset.idx, 10);
        if(mode === "solo") soloRemoveFood(t.dataset.habit, fidx);
        else if(mode === "board") boardRemoveFood(t.dataset.member, t.dataset.habit, fidx);
        return;
      }
      if(action === "opennutrition"){
        openNutrition(t.dataset.member);
        return;
      }
      if(action === "scanfood"){
        openLiveScanner(t.dataset.member, t.dataset.habit);
        return;
      }
      if(action === "edittarget"){
        var curTarget = mode === "solo" ? (soloState.calorieTarget || 2000) : ((findMember(t.dataset.member) || {}).calorieTarget || 2000);
        t.outerHTML = '<span class="food-target-edit"><input type="number" min="500" max="6000" step="50" value="' + curTarget + '" data-role="target-input"><button type="button" data-action="savetarget" data-member="' + escHTML(t.dataset.member || "") + '" data-habit="' + escHTML(t.dataset.habit) + '">Save</button></span>';
        return;
      }
      if(action === "savetarget"){
        var tgInput = t.parentElement.querySelector('[data-role="target-input"]');
        var tgNum = parseInt(tgInput.value, 10);
        if(!(tgNum > 0)) return;
        if(mode === "solo") soloSetTarget(t.dataset.habit, tgNum);
        else if(mode === "board") boardSetTarget(t.dataset.member, t.dataset.habit, tgNum);
        return;
      }
      if(action === "daytoday"){
        viewedDate = REAL_TODAY;
        render();
        return;
      }
      if(action === "wtunit"){
        var wuGroup = t.parentElement;
        Array.prototype.forEach.call(wuGroup.querySelectorAll("button"), function(b){ b.classList.remove("selected"); });
        t.classList.add("selected");
        saveWeightFrom(t.closest(".weight-form"), true);
        return;
      }
      if(action === "setsex"){
        if(mode === "solo") soloSetSex(t.dataset.value);
        else if(mode === "board") boardSetSex(t.dataset.member, t.dataset.value);
        return;
      }
    }
    if(e.target.closest && e.target.closest("#joinBtn")){
      var nameEl = document.getElementById("joinName");
      var name = (nameEl.value || "").trim();
      if(!name) { nameEl.focus(); return; }
      var importEl = document.getElementById("importHistory");
      boardJoin(name, importEl ? importEl.checked : false);
      return;
    }
  });

  document.body.addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.id === "joinName"){
      document.getElementById("joinBtn").click();
    }
  });

  function updateFoodPreview(formEl){
    var nameInput = formEl.querySelector('[data-role="ff-name"]');
    var amtInput = formEl.querySelector('[data-role="ff-amt"]');
    var unitBtn = formEl.querySelector(".unit-toggle button.selected");
    var manualRow = formEl.querySelector(".food-manual-row");
    var preview = formEl.querySelector('[data-role="ff-preview"]');
    var name = (nameInput.value || "").trim();
    var amt = parseFloat(amtInput.value);
    var unit = unitBtn ? unitBtn.dataset.unit : "g";
    var match = foodMatch(name);
    if(match && unit === "ea" && match.serving && amt > 0){
      var gramsEa = amt * match.serving;
      var kcalEa = Math.round(match.kcal100 * gramsEa / 100);
      var eaDesc = /^\d/.test(match.unit) ? (amt === 1 ? "1 serving (" + match.unit + ")" : amt + " servings (" + match.unit + " each)") : (amt + " " + match.unit);
      preview.textContent = "≈ " + kcalEa + " kcal (" + eaDesc + " ≈ " + Math.round(gramsEa) + "g)";
      manualRow.classList.remove("show");
    } else if(match && unit !== "ea" && amt > 0){
      var grams = amt * (UNIT_GRAMS[unit] || 1);
      var kcal = Math.round(match.kcal100 * grams / 100);
      preview.textContent = "≈ " + kcal + " kcal (" + match.name + ", " + Math.round(grams) + "g)";
      manualRow.classList.remove("show");
    } else if(name && amt > 0){
      preview.textContent = unit === "ea" ? "Not in our food list — enter total calories for that amount below." : "Not in our food list — enter calories below.";
      manualRow.classList.add("show");
    } else {
      preview.textContent = "";
      manualRow.classList.remove("show");
    }
  }
  /* Weight and age auto-save: mutate state + re-render immediately (so calorie
     estimates update live as you type) with focus preserved, then persist after
     a short pause in typing — no save button, no per-keystroke network/publish. */
  var weightSaveTimer = null, ageSaveTimer = null, nameSaveTimer = null, sleepSaveTimer = null, goalSaveTimer = null;
  function persistMemberChange(){
    if(mode === "solo") saveSolo(soloState);
    else if(mode === "board") schedulePublish();
  }
  function saveWeightFrom(formEl, immediate){
    if(!formEl) return;
    var input = formEl.querySelector('[data-role="wt-value"]');
    var unitBtn = formEl.querySelector(".unit-toggle button.selected");
    var val = parseFloat(input.value);
    var unit = unitBtn ? unitBtn.dataset.unit : "lb";
    var memberId = formEl.dataset.member;
    var target = mode === "solo" ? soloState : findMember(memberId);
    if(!target) return;
    target.weightUnit = unit;
    if(val > 0) ensureDay(target.days, viewedDate).weight = val;
    renderPreserveFocus();
    clearTimeout(weightSaveTimer);
    if(immediate) persistMemberChange();
    else weightSaveTimer = setTimeout(persistMemberChange, 700);
  }
  function saveSleepFrom(input){
    var val = parseFloat(input.value);
    var memberId = input.dataset.member;
    var target = mode === "solo" ? soloState : findMember(memberId);
    if(!target) return;
    var rec = ensureDay(target.days, viewedDate);
    if(val > 0){
      rec.sleepHours = val;
      rec.sleep7 = val >= 7;
    } else {
      delete rec.sleepHours;
    }
    renderPreserveFocus();
    clearTimeout(sleepSaveTimer);
    sleepSaveTimer = setTimeout(persistMemberChange, 700);
  }
  document.body.addEventListener("input", function(e){
    var form = e.target.closest(".food-form");
    if(form) updateFoodPreview(form);
    if(e.target.matches && e.target.matches('[data-role="wt-value"]')){
      saveWeightFrom(e.target.closest(".weight-form"), false);
    }
    if(e.target.matches && e.target.matches('[data-role="sleep-hours"]')){
      saveSleepFrom(e.target);
    }
    if(e.target.matches && e.target.matches('[data-role="goal-weight"], [data-role="goal-date"]')){
      var goalMemberId = e.target.dataset.member;
      var goalTarget = mode === "solo" ? soloState : findMember(goalMemberId);
      if(goalTarget){
        if(e.target.dataset.role === "goal-weight"){
          var gw = parseFloat(e.target.value);
          goalTarget.goalWeight = gw > 0 ? gw : null;
        } else {
          goalTarget.goalDate = e.target.value || null;
        }
        renderPreserveFocus();
        clearTimeout(goalSaveTimer);
        goalSaveTimer = setTimeout(persistMemberChange, 700);
      }
    }
    if(e.target.matches && e.target.matches('[data-role="age-input"]')){
      var num = parseInt(e.target.value, 10);
      var age = num > 0 ? num : null;
      var memberId = e.target.dataset.member;
      var target = mode === "solo" ? soloState : findMember(memberId);
      if(target){
        target.age = age;
        renderPreserveFocus();
        clearTimeout(ageSaveTimer);
        ageSaveTimer = setTimeout(persistMemberChange, 700);
      }
    }
    if(e.target.matches && e.target.matches('[data-role="solo-name"]')){
      soloState.name = e.target.value;
      renderPreserveFocus();
      clearTimeout(nameSaveTimer);
      nameSaveTimer = setTimeout(function(){ saveSolo(soloState); }, 700);
    }
  });

  function goToDay(newDate){
    viewedDate = newDate;
    render();
  }
  els.dayPrevBtn.addEventListener("click", function(){ goToDay(addDays(viewedDate, -1)); });
  els.dayNextBtn.addEventListener("click", function(){ goToDay(addDays(viewedDate, 1)); });

  els.addHabitBtn.addEventListener("click", openPicker);
  els.pickerClose.addEventListener("click", closePicker);
  els.pickerOverlay.addEventListener("click", function(e){ if(e.target === els.pickerOverlay) closePicker(); });
  els.leaderboardBtn.addEventListener("click", function(){ openLeaderboard(false); });
  els.lbClose.addEventListener("click", closeLeaderboard);
  els.lbOverlay.addEventListener("click", function(e){ if(e.target === els.lbOverlay) closeLeaderboard(); });
  els.nutriClose.addEventListener("click", closeNutrition);
  els.nutriOverlay.addEventListener("click", function(e){ if(e.target === els.nutriOverlay) closeNutrition(); });
  els.coachBtn.innerHTML = ICONS.sparkle + "<span>Coach</span>";
  els.coachBtn.addEventListener("click", openCoach);
  els.coachClose.addEventListener("click", closeCoach);
  els.coachOverlay.addEventListener("click", function(e){ if(e.target === els.coachOverlay) closeCoach(); });
  els.photoFoodInput.addEventListener("change", function(e){ onPhotoFoodSelected(e.target.files && e.target.files[0]); });
  els.captureClose.addEventListener("click", closeCaptureView);
  els.captureOverlay.addEventListener("click", function(e){ if(e.target === els.captureOverlay) closeCaptureView(); });
  els.captureShutterBtn.addEventListener("click", captureShot);
  els.captureUseFileBtn.addEventListener("click", function(){ closeCaptureView(); useFileInput(); });
  els.pickerAddBtn.addEventListener("click", function(){
    var chosen = SUGGESTIONS.filter(function(s){ return pickerSelected.has(s.id); })
      .map(function(s){ return { id: s.id, label: s.label, icon: s.icon, kind: s.kind }; });
    if(!chosen.length) return;
    addHabitsEverywhere(chosen);
    pickerSelected = new Set();
    renderPicker();
  });
  els.customAdd.addEventListener("click", function(){
    var label = els.customLabel.value.trim();
    if(!label) { els.customLabel.focus(); return; }
    var habit = { id: "custom_" + uid(), label: label, icon: "star", kind: els.customExercise.checked ? "exercise" : "simple" };
    addHabitsEverywhere([habit]);
    els.customLabel.value = "";
    els.customExercise.checked = false;
  });

  els.inviteBtn.addEventListener("click", function(){
    var url = location.href;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        showToast("Link copied — friends need “can edit” access to join in");
      }).catch(function(){ promptCopy(url); });
    } else {
      promptCopy(url);
    }
  });
  function promptCopy(url){
    var input = document.createElement("input");
    input.value = url; input.readOnly = true;
    input.style.position = "fixed"; input.style.left = "-9999px";
    document.body.appendChild(input);
    input.select();
    try{ document.execCommand("copy"); showToast("Link copied — friends need “can edit” access to join in"); }
    catch(e){ showToast("Copy the page URL to invite friends"); }
    input.remove();
  }

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      var wasOnToday = viewedDate === REAL_TODAY;
      REAL_TODAY = todayKey();
      if(wasOnToday) viewedDate = REAL_TODAY;
      render();
    }
  });

  /* ---------- boot ---------- */
  async function boot(){
    var cap = null;
    try{
      if(window.claude && typeof window.claude.use === "function"){
        cap = await window.claude.use("artifact");
      }
    }catch(e){ cap = null; }

    if(!cap){
      mode = "solo";
      soloState = loadSolo();
      render();
      return;
    }

    boardCap = cap;
    var dataEl = document.getElementById("boardData");
    try{
      board = JSON.parse(dataEl.textContent);
    }catch(e){
      board = { habits: DEFAULT_HABITS.slice(), members: [] };
    }
    if(!board.habits) board.habits = DEFAULT_HABITS.slice();
    migrateHabitsCore(board.habits);
    if(!board.members) board.members = [];
    if(!board.customFoods) board.customFoods = [];

    if(me && findMember(me.id)){
      mode = "board";
    } else {
      me = null;
      mode = "board";
    }
    render();
  }

  boot().then(function(){
    checkEveningReminder();
    setInterval(checkEveningReminder, 60000);
  });
})();
</script>
